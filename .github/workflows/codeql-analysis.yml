name: "CodeQL"

on:
  push:
    branches: [ production, develop, release, master ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: photoprism/develop:261027-resolute
    defaults:
      run:
        shell: bash
    env:
      GOMAXPROCS: 2
      GOFLAGS: -p=2
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build Go Code for Analysis
      if: matrix.language == 'go'
      run: make build-go

    - name: CodeQL Analysis
      uses: github/codeql-action/analyze@v4
